
{% extends "base.html" %}

{% block title %}Student Login | ForenQuest{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1>Welcome Back</h1>

        <p>Login to continue your forensic investigations.</p>

        <form method="POST" action="{{ url_for('login') }}">

            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">Login</button>

        </form>

        <p class="auth-link">
            Don't have an account?
            <a href="{{ url_for('register') }}">Register here</a>
        </p>

    </div>

</div>

{% endblock %}
